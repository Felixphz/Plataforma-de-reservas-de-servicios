version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: service_platform_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_password_local
      POSTGRES_DB: tu_base_de_datos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
